services:
  rembg:
    container_name: itemlens-rembg
    build: ./services/rembg
    image: itemlens-rembg:latest
    command: s --no-ui
    environment:
      - OMP_NUM_THREADS=2
    ports:
      - "7000:7000"
    volumes:
      - ./services/rembg-data:/root/.rembg
    security_opt:
      - seccomp:unconfined
    restart: unless-stopped

  paddleocr:
    container_name: itemlens-paddleocr
    build: ./services/paddleocr
    image: paddleocrfastapi:paddlejr
    environment:
      - TZ=Europe/Amsterdam
      - PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True
      - FLAGS_use_mkldnn=0
      - PADDLE_PDX_ENABLE_MKLDNN_BYDEFAULT=0
      - OMP_WAIT_POLICY=PASSIVE
      - OMP_NUM_THREADS=2
    ports:
      - "8000:8000"
    volumes:
      - ./services/paddleocr/downloads:/root/.paddleocr
      - ./services/paddleocr/paddlex_cache:/root/.paddlex
    security_opt:
      - seccomp:unconfined
    restart: unless-stopped

  singlefile:
    container_name: itemlens-singlefile
    build: ./services/singlefile
    command: node webserver.js 8001
    ports:
      - "8001:8001"
    volumes:
      - ./services/singlefile:/opt/app
      - /opt/app/node_modules
    security_opt:
      - seccomp:unconfined
    restart: unless-stopped

  app:
    profiles: ["full"]
    container_name: itemlens-app
    build:
      context: .
      dockerfile: Dockerfile
    image: itemlens-app:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - REMBG_URL=http://rembg:7000
      - PADDLE_URL=http://paddleocr:8000
      - SINGLEFILE_URL=http://singlefile:8001
    volumes:
      - ./prisma:/app/prisma
      - ./data:/app/data
      - ./build:/app/build
      - ./server.js:/app/server.js
      - ./cert.pem:/app/cert.pem:ro
      - ./key.pem:/app/key.pem:ro
    security_opt:
      - seccomp:unconfined
    depends_on:
      - rembg
      - paddleocr
      - singlefile
